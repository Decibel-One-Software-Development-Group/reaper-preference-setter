name: Build Executables

on:
  push:
    tags:
      - "v*"
  # Manual runs build and notarize the same artifacts without cutting a
  # release — use this to prove a build before tagging. Artifacts land on the
  # run itself; nothing is uploaded to a GitHub release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create_release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true

  build_macos:
    needs: create_release
    # Runs on tag pushes (after create_release) and on manual dispatch, where
    # create_release is skipped.
    if: ${{ !cancelled() && (needs.create_release.result == 'success' || needs.create_release.result == 'skipped') }}
    # One universal2 .app — arm64 + x86_64 in a single binary, so it runs
    # natively on both Apple Silicon and Intel Macs from one download.
    #
    # PyInstaller can only emit universal2 when the Python it freezes is itself
    # universal2, and actions/setup-python only ships single-arch macOS builds.
    # So we install python.org's official universal2 framework instead — its
    # Python, _tkinter, and bundled Tcl/Tk 8.6 all carry both slices.
    #
    # 3.12.10 is the last 3.12 with a macOS installer (3.12 is security-fix
    # only from 3.12.11 on, source-only). Move to a 3.13.x installer when this
    # needs updating.
    runs-on: macos-14

    env:
      DMG: REAPER-Preference-Setter-macOS.dmg
      PY_VERSION: "3.12.10"
      PY_SHORT: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install universal2 Python from python.org
        run: |
          curl -fsSL -o python.pkg \
            "https://www.python.org/ftp/python/${PY_VERSION}/python-${PY_VERSION}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          PY_ROOT="/Library/Frameworks/Python.framework/Versions/${PY_SHORT}"
          echo "PYBIN=${PY_ROOT}/bin/python3" >> "$GITHUB_ENV"
          # A thin Python silently produces a thin app, which is exactly the
          # bug this build exists to prevent. Fail here, not at download time.
          lipo -info "${PY_ROOT}/Python"
          lipo -info "${PY_ROOT}/Python" | grep -q "x86_64 arm64" \
            || { echo "::error::python.org framework is not universal2"; exit 1; }
          "${PY_ROOT}/bin/python3" -c "import sys, _tkinter; print(sys.version)"

      - name: Install PyInstaller
        run: |
          "$PYBIN" -m pip install --upgrade pip
          "$PYBIN" -m pip install pyinstaller tkinterdnd2

      - name: Build universal2 .app with PyInstaller
        run: |
          "$PYBIN" -m PyInstaller --windowed --onedir --noconfirm \
            --name "REAPER Preference Setter" \
            --icon icon.icns \
            --osx-bundle-identifier com.nomismatt.reaper-preference-setter \
            --collect-all tkinterdnd2 \
            --target-architecture universal2 \
            configure_reaper.py

      - name: Verify the app is universal
        run: |
          APP="dist/REAPER Preference Setter.app"
          MAIN="${APP}/Contents/MacOS/REAPER Preference Setter"
          PYLIB="$(find "${APP}" -type f -name Python -print -quit)"

          for f in "${MAIN}" "${PYLIB}"; do
            lipo -info "${f}"
            lipo -info "${f}" | grep -q "x86_64 arm64" \
              || { echo "::error::${f} is not universal2"; exit 1; }
          done

          # tkinterdnd2 ships its tkdnd libraries thin, one directory per
          # platform, and picks the matching one at runtime — those are
          # expected here. Anything else thin is worth a look.
          echo "Thin Mach-O files in the bundle (tkdnd is expected):"
          find "${APP}" -type f \( -name '*.dylib' -o -name '*.so' -o -perm -111 \) -print0 \
            | xargs -0 -n1 file 2>/dev/null \
            | grep 'Mach-O' | grep -v 'universal binary' || echo "  (none)"

      - name: Import Apple Certificate
        run: |
          if security list-keychains | grep -q "github_build.keychain"; then
            security delete-keychain github_build.keychain
          fi
          security create-keychain -p "" github_build.keychain
          security default-keychain -s github_build.keychain
          security set-keychain-settings -lut 21600 github_build.keychain
          echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > apple_certificate.p12
          security import apple_certificate.p12 -k github_build.keychain -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcrun
          security unlock-keychain -p "" github_build.keychain
          security set-key-partition-list -S 'apple-tool:,apple:' -s -k "" github_build.keychain
          security list-keychain -d user -s github_build.keychain 'login-keychain'

      - name: Unlock keychain
        run: |
          security unlock-keychain -p "" github_build.keychain
          security set-key-partition-list -S apple-tool:,apple: -k "" -D "Developer" -t private github_build.keychain

      - name: Codesign .app bundle
        run: |
          APP="dist/REAPER Preference Setter.app"
          # Sign all .so and .dylib files first
          find "${APP}" -iname '*.so' -or -iname '*.dylib' | while read libfile; do
            codesign -s "${{ secrets.APPLE_CERTIFICATE_NAME }}" \
              --entitlements entitlements.plist \
              --deep "${libfile}" \
              --force --timestamp --options runtime
          done
          # Sign the whole .app bundle
          codesign -s "${{ secrets.APPLE_CERTIFICATE_NAME }}" \
            --entitlements entitlements.plist \
            --deep --force --timestamp --options runtime \
            "${APP}"
          codesign --verify --verbose=4 "${APP}"

      - name: Create DMG
        run: |
          brew install create-dmg || true
          max_tries=5
          i=0
          until create-dmg \
            --volname "REAPER Preference Setter" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --app-drop-link 450 185 \
            --hide-extension "REAPER Preference Setter.app" \
            "${DMG}" \
            "dist/REAPER Preference Setter.app"
          do
            if [ $i -eq $max_tries ]; then
              echo "create-dmg failed, falling back to hdiutil"
              hdiutil create -volname "REAPER Preference Setter" \
                -srcfolder "dist/REAPER Preference Setter.app" \
                -ov -format UDZO \
                "${DMG}"
              break
            fi
            i=$((i+1))
          done

      - name: Notarize DMG
        run: |
          xcrun notarytool submit "${DMG}" \
            --apple-id "${{ secrets.APPLE_DEVELOPER_ID_USER }}" \
            --password "${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_DEVELOPER_ID_TEAM }}" \
            --wait --verbose

      - name: Staple DMG
        run: |
          xcrun stapler staple "${DMG}"
          xcrun stapler validate "${DMG}"

      - name: Upload DMG as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ env.DMG }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ env.DMG }}

  build_windows:
    needs: create_release
    if: ${{ !cancelled() && (needs.create_release.result == 'success' || needs.create_release.result == 'skipped') }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller tkinterdnd2

      - name: Build executable
        run: pyinstaller --windowed --onefile --name "REAPER-Preference-Setter" --icon icon.ico --collect-all tkinterdnd2 configure_reaper.py

      - name: Zip exe with README
        run: Compress-Archive -Path "dist/REAPER-Preference-Setter.exe", "README.md" -DestinationPath "REAPER-Preference-Setter-Windows.zip"
        shell: pwsh

      - name: Upload zip as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: REAPER-Preference-Setter-Windows.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            REAPER-Preference-Setter-Windows.zip
