name: Build Executables

on:
  push:
    tags:
      - "v*"
  # Manual runs build and notarize the same artifacts without cutting a
  # release — use this to prove a build before tagging. Artifacts land on the
  # run itself; nothing is uploaded to a GitHub release.
  workflow_dispatch:

permissions:
  contents: write

# build.yml and deploy-site.yml both push to gh-pages, and two simultaneous
# pushes wedge GitHub Pages. Queue rather than cancel — a site copy tweak must
# never cancel an in-flight release.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

env:
  # Sparkle fetches the appcast and the DMG from gh-pages, not from the GitHub
  # Release: Release assets 404 for the anonymous fetch an updater makes.
  PAGES_BASE: "https://decibel-one-software-development-group.github.io/reaper-preference-setter"
  MIN_OS: "11.0"

jobs:
  create_release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Require release notes
        # Suite-wide gate: these notes are the release body and the description
        # in the update window. A tag without them is a release nobody can read
        # — fail before spending a build, not after.
        run: |
          NOTES="release-notes/${{ steps.v.outputs.version }}.md"
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES is missing or empty — write it (and prepend HISTORY.md) before tagging."
            exit 1
          fi
          echo "release notes present ($(wc -l < "$NOTES") lines)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: SiRPS ${{ github.ref_name }}
          draft: true
          prerelease: false
          body_path: release-notes/${{ steps.v.outputs.version }}.md

  build_macos:
    needs: create_release
    # Runs on tag pushes (after create_release) and on manual dispatch, where
    # create_release is skipped.
    if: ${{ !cancelled() && (needs.create_release.result == 'success' || needs.create_release.result == 'skipped') }}
    # One universal2 .app — arm64 + x86_64 in a single binary, so it runs
    # natively on both Apple Silicon and Intel Macs from one download.
    #
    # PyInstaller can only emit universal2 when the Python it freezes is itself
    # universal2, and actions/setup-python only ships single-arch macOS builds.
    # So we install python.org's official universal2 framework instead — its
    # Python, _tkinter, and bundled Tcl/Tk 8.6 all carry both slices.
    #
    # 3.12.10 is the last 3.12 with a macOS installer (3.12 is security-fix
    # only from 3.12.11 on, source-only). Move to a 3.13.x installer when this
    # needs updating.
    runs-on: macos-14

    env:
      PY_VERSION: "3.12.10"
      PY_SHORT: "3.12"
      SPARKLE_VERSION: "2.9.6"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version + DMG name
        # A manual run has no tag; it still builds, signs and notarizes so a
        # build can be proved before tagging, but it ships nothing.
        run: |
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DMG=SiRPS-${VERSION}-universal.dmg" >> "$GITHUB_ENV"
          echo "building SiRPS $VERSION"

      - name: Pin the build version to the tag
        # APP_VERSION is what the About box and the update check compare
        # against. Aligning it to the tag here means a release can never report
        # a stale number, and there's no second place to remember to edit.
        run: |
          sed -i '' -E "s/^APP_VERSION = \".*\"/APP_VERSION = \"${VERSION}\"/" configure_reaper.py
          grep -m1 '^APP_VERSION' configure_reaper.py

      - name: Install universal2 Python from python.org
        run: |
          curl -fsSL -o python.pkg \
            "https://www.python.org/ftp/python/${PY_VERSION}/python-${PY_VERSION}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          PY_ROOT="/Library/Frameworks/Python.framework/Versions/${PY_SHORT}"
          echo "PYBIN=${PY_ROOT}/bin/python3" >> "$GITHUB_ENV"
          # A thin Python silently produces a thin app, which is exactly the
          # bug this build exists to prevent. Fail here, not at download time.
          lipo -info "${PY_ROOT}/Python"
          lipo -info "${PY_ROOT}/Python" | grep -q "x86_64 arm64" \
            || { echo "::error::python.org framework is not universal2"; exit 1; }
          "${PY_ROOT}/bin/python3" -c "import sys, _tkinter; print(sys.version)"

      - name: Install PyInstaller
        run: |
          "$PYBIN" -m pip install --upgrade pip
          "$PYBIN" -m pip install pyinstaller tkinterdnd2

      - name: Build universal2 .app with PyInstaller
        run: |
          "$PYBIN" -m PyInstaller --windowed --onedir --noconfirm \
            --name "SiRPS" \
            --icon icon.icns \
            --osx-bundle-identifier com.decibelone.sirps \
            --collect-all tkinterdnd2 \
            --target-architecture universal2 \
            configure_reaper.py

      - name: Verify the app is universal
        run: |
          APP="dist/SiRPS.app"
          MAIN="${APP}/Contents/MacOS/SiRPS"
          PYLIB="$(find "${APP}" -type f -name Python -print -quit)"

          for f in "${MAIN}" "${PYLIB}"; do
            lipo -info "${f}"
            lipo -info "${f}" | grep -q "x86_64 arm64" \
              || { echo "::error::${f} is not universal2"; exit 1; }
          done

          # tkinterdnd2 ships its tkdnd libraries thin, one directory per
          # platform, and picks the matching one at runtime — those are
          # expected here. Anything else thin is worth a look.
          echo "Thin Mach-O files in the bundle (tkdnd is expected):"
          find "${APP}" -type f \( -name '*.dylib' -o -name '*.so' -o -perm -111 \) -print0 \
            | xargs -0 -n1 file 2>/dev/null \
            | grep 'Mach-O' | grep -v 'universal binary' || echo "  (none)"

      - name: Import Apple Certificate
        run: |
          if security list-keychains | grep -q "github_build.keychain"; then
            security delete-keychain github_build.keychain
          fi
          security create-keychain -p "" github_build.keychain
          security default-keychain -s github_build.keychain
          security set-keychain-settings -lut 21600 github_build.keychain
          echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > apple_certificate.p12
          security import apple_certificate.p12 -k github_build.keychain -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcrun
          security unlock-keychain -p "" github_build.keychain
          security set-key-partition-list -S 'apple-tool:,apple:' -s -k "" github_build.keychain
          security list-keychain -d user -s github_build.keychain 'login-keychain'

      - name: Unlock keychain
        run: |
          security unlock-keychain -p "" github_build.keychain
          security set-key-partition-list -S apple-tool:,apple: -k "" -D "Developer" -t private github_build.keychain

      - name: Codesign .app bundle
        run: |
          APP="dist/SiRPS.app"
          # Sign all .so and .dylib files first
          find "${APP}" -iname '*.so' -or -iname '*.dylib' | while read libfile; do
            codesign -s "${{ secrets.APPLE_CERTIFICATE_NAME }}" \
              --entitlements entitlements.plist \
              --deep "${libfile}" \
              --force --timestamp --options runtime
          done
          # Sign the whole .app bundle
          codesign -s "${{ secrets.APPLE_CERTIFICATE_NAME }}" \
            --entitlements entitlements.plist \
            --deep --force --timestamp --options runtime \
            "${APP}"
          codesign --verify --verbose=4 "${APP}"

      - name: Create DMG
        run: |
          brew install create-dmg || true
          max_tries=5
          i=0
          until create-dmg \
            --volname "SiRPS" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --app-drop-link 450 185 \
            --hide-extension "SiRPS.app" \
            "${DMG}" \
            "dist/SiRPS.app"
          do
            if [ $i -eq $max_tries ]; then
              echo "create-dmg failed, falling back to hdiutil"
              hdiutil create -volname "SiRPS" \
                -srcfolder "dist/SiRPS.app" \
                -ov -format UDZO \
                "${DMG}"
              break
            fi
            i=$((i+1))
          done

      - name: Notarize DMG
        run: |
          xcrun notarytool submit "${DMG}" \
            --apple-id "${{ secrets.APPLE_DEVELOPER_ID_USER }}" \
            --password "${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_DEVELOPER_ID_TEAM }}" \
            --wait --verbose

      - name: Staple DMG
        run: |
          xcrun stapler staple "${DMG}"
          xcrun stapler validate "${DMG}"

      - name: Upload DMG as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ env.DMG }}

      # ── Appcast + gh-pages ────────────────────────────────────────────────
      # The app checks for updates against appcast.xml on gh-pages. A GitHub
      # release can't serve that job: there's no stable URL for "the newest
      # build", and the appcast has to sit beside the DMG it points at.

      - name: Materialize Sparkle EdDSA private key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_EDDSA_PRIVATE_KEY is not set for this repo."
            echo "::error::Generate one with Sparkle's generate_keys, or reuse the suite key, and add it as a repository secret."
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/sparkle-ed.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "SPARKLE_PRIVATE_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Fetch Sparkle's sign_update
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p build/sparkle && tar -xJf sparkle.tar.xz -C build/sparkle
          find build/sparkle -name sign_update -type f -exec chmod +x {} \;

      - name: Fetch existing appcast (if any)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          # Read the appcast from the gh-pages BRANCH, not the Pages CDN. The
          # CDN lags the branch by up to ~10 min, so back-to-back releases would
          # each append to a stale copy and silently drop entries in between.
          gh api "repos/${{ github.repository }}/contents/appcast.xml?ref=gh-pages" \
            -H "Accept: application/vnd.github.raw" > build/existing-appcast.xml 2>/dev/null || true
          grep -q "<rss" build/existing-appcast.xml 2>/dev/null \
            || { echo "no existing appcast (first release)"; rm -f build/existing-appcast.xml; }

      - name: Generate + sign appcast entry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          export DMG="${DMG}"
          export RELEASE_URL="${PAGES_BASE}/${DMG}"
          export SIGN_UPDATE="$(find build/sparkle -name sign_update -type f | head -1)"
          [ -x "$SIGN_UPDATE" ] || { echo "::error::sign_update not found in the Sparkle tarball"; exit 1; }
          ./scripts/update-appcast.sh

      - name: Stage appcast + DMG + site for gh-pages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p build/gh-pages
          cp build/appcast.xml build/gh-pages/appcast.xml
          cp "${DMG}" build/gh-pages/
          # Stable human-facing alias: one URL that always serves the newest
          # build. The updater uses the versioned URL from the appcast.
          cp "${DMG}" "build/gh-pages/SiRPS-latest.dmg"
          cp -R site/. build/gh-pages/
          sed -i '' "s|<span id=\"sitever\">[^<]*</span>|<span id=\"sitever\">${VERSION}</span>|" build/gh-pages/index.html

      - name: Publish to gh-pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: build/gh-pages
          publish_branch: gh-pages
          keep_files: true
          commit_message: "appcast + DMG: SiRPS ${{ github.ref_name }}"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ env.DMG }}

  build_windows:
    needs: create_release
    if: ${{ !cancelled() && (needs.create_release.result == 'success' || needs.create_release.result == 'skipped') }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version + pin it to the tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v',''
          } else {
            $v = '0.0.0-dev'
          }
          "VERSION=$v"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP=SiRPS-$v-Windows.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Get-Content configure_reaper.py) -replace '^APP_VERSION = ".*"', "APP_VERSION = `"$v`"" |
            Set-Content configure_reaper.py
          Select-String -Path configure_reaper.py -Pattern '^APP_VERSION' | Select-Object -First 1

      - name: Install PyInstaller
        run: pip install pyinstaller tkinterdnd2

      - name: Build executable
        run: pyinstaller --windowed --onefile --name "SiRPS" --icon icon.ico --collect-all tkinterdnd2 configure_reaper.py

      - name: Zip exe with README
        run: Compress-Archive -Path "dist/SiRPS.exe", "README.md" -DestinationPath "$env:ZIP"
        shell: pwsh

      - name: Upload zip as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ${{ env.ZIP }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ env.ZIP }}
